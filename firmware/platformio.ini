; Claude Clock firmware (see docs/DEVELOPMENT.md):
;   pio run -e clock        -> firmware for the ESP8266 clock
;   pio test -e native      -> unit tests of lib/model on the host

[platformio]
default_envs = clock

[env:clock]
platform = espressif8266
board = esp12e
framework = arduino
; Stock layout (4M2M): OTA writes stay below 0x200000; LittleFS/EEPROM never touched.
board_build.ldscript = eagle.flash.4m2m.ld
board_build.flash_mode = dout
board_build.f_cpu = 80000000L
lib_ldf_mode = deep+
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    ricmoo/QRCode @ 0.0.1
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_SPI_MODE=SPI_MODE3
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000

[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17
